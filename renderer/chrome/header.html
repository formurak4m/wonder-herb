<!-- header.html — the SHARED site chrome (P10).
     Lifted once from 產品介紹.html, which is now retired to legacy/. This file is
     the source of truth: the renderer no longer copies chrome out of a page.
     {{media.*}} is filled from data/site.json, so re-hosting the logo or the
     flags is a data edit. The active nav link is NOT here - renderer/chrome.js
     adds it for whichever page is being rendered. -->
<div class="fixed-nav-wrapper">
<div class="top-bar">
  <div class="container">
    <div class="lang-selector" aria-label="語言切換器" role="group">
      <span id="langZhBtn" data-lang="zh" role="button" tabindex="0" aria-label="切換至中文" aria-current="true" class="active-lang"><img src="{{media.flags.zh}}" alt="中文" class="flag-img"> 中文</span> |
      <span id="langEnBtn" data-lang="en" role="button" tabindex="0" aria-label="Switch to English" aria-current="false"><img src="{{media.flags.en}}" alt="English" class="flag-img"> EN</span> |
      <span id="langDeBtn" data-lang="de" role="button" tabindex="0" aria-label="Auf Deutsch umschalten" aria-current="false"><img src="{{media.flags.de}}" alt="Deutsch" class="flag-img"> DE</span> |
      <span id="langEsBtn" data-lang="es" role="button" tabindex="0" aria-label="Cambiar a Español" aria-current="false"><img src="{{media.flags.es}}" alt="Español" class="flag-img"> ES</span> |
      <span id="langFrBtn" data-lang="fr" role="button" tabindex="0" aria-label="Passer en Français" aria-current="false"><img src="{{media.flags.fr}}" alt="Français" class="flag-img"> FR</span> |
      <span id="langJaBtn" data-lang="ja" role="button" tabindex="0" aria-label="日本語に切り替え" aria-current="false"><img src="{{media.flags.ja}}" alt="日本語" class="flag-img"> JA</span> |
      <span id="langRuBtn" data-lang="ru" role="button" tabindex="0" aria-label="Переключить на русский" aria-current="false"><img src="{{media.flags.ru}}" alt="Русский" class="flag-img"> RU</span>
    </div>
    <div class="lang-selector-mobile" aria-label="語言切換">
      <div class="lang-current" id="langCurrentBtn" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false">
        <img src="{{media.flags.zh}}" alt="" id="langCurrentFlag"> <span id="langCurrentText">中文</span>
      </div>
      <div class="lang-dropdown" role="listbox" id="langDropdown">
        <button type="button" data-lang="zh" role="option"><img src="{{media.flags.zh}}" alt=""> 中文</button>
        <button type="button" data-lang="en" role="option"><img src="{{media.flags.en}}" alt=""> English</button>
        <button type="button" data-lang="de" role="option"><img src="{{media.flags.de}}" alt=""> Deutsch</button>
        <button type="button" data-lang="es" role="option"><img src="{{media.flags.es}}" alt=""> Español</button>
        <button type="button" data-lang="fr" role="option"><img src="{{media.flags.fr}}" alt=""> Français</button>
        <button type="button" data-lang="ja" role="option"><img src="{{media.flags.ja}}" alt=""> 日本語</button>
        <button type="button" data-lang="ru" role="option"><img src="{{media.flags.ru}}" alt=""> Русский</button>
      </div>
    </div>
  </div>
</div>
